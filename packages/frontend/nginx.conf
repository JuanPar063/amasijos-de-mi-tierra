server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API -> backend (red interna de docker-compose)
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
